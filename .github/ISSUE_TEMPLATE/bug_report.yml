name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Focus Reader version
      description: Shown in the tray menu → "Sobre..." (e.g. 0.1.0 (build 26)).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: displays
    attributes:
      label: Displays
      description: Number of monitors, resolution and scale (100%, 125%, 150%...), and mouse pointer size if changed.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings
      description: Contents of %APPDATA%\FocusReader\settings.json, if relevant.
      render: json
